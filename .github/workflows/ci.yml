name: Continuous Integration - Lint & Compile Gems

on:
  push:
    branches: [ main ]
    paths:
      - 'gems/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate Schema & Build Manifests
    runs-on: [self-hosted, docker, gem-studio]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install --no-cache-dir --break-system-packages -r requirements.txt

      - name: Validate and build all active Gems
        run: |
          mkdir -p dist
          for gem_dir in gems/*/; do
            # Omitir template boilerplate de compilación directa
            if [ "$(basename "$gem_dir")" = "_template" ]; then
              echo "Saltando boilerplate template: $gem_dir"
              continue
            fi

            if [ -f "${gem_dir}meta.yaml" ]; then
              echo "==> Compilando Gem: $gem_dir"
              python3 scripts/build-gem.py "$gem_dir"
            fi
          done

      - name: Upload compiled JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-gem-manifests
          path: dist/*.json
          if-no-files-found: error
          retention-days: 7
