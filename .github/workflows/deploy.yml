name: Continuous Delivery - Publish Gems to Pages

on:
  workflow_run:
    workflows: ["Continuous Integration - Lint & Compile Gems"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Manifests & Deploy to GitHub Pages
    # Condición estricta: solo desplegar si el workflow de CI concluyó exitosamente
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, docker, gem-studio]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install --no-cache-dir --break-system-packages -r requirements.txt

      - name: Compile Gems and generate index catalog
        run: |
          mkdir -p dist

          for gem_dir in gems/*/; do
            if [ "$(basename "$gem_dir")" = "_template" ]; then
              continue
            fi

            if [ -f "${gem_dir}meta.yaml" ]; then
              gem_slug="$(basename "$gem_dir")"
              echo "==> Compilando para release: $gem_slug"
              python3 scripts/build-gem.py "$gem_dir"
            fi
          done

          # Generar catálogo centralizado index.json para descubrimiento
          python3 -c '
          import json, glob, os
          manifests = []
          for f in sorted(glob.glob("dist/*.json")):
              with open(f, "r", encoding="utf-8") as fp:
                  data = json.load(fp)["gem_configuration"]
                  manifests.append({
                      "slug": os.path.splitext(os.path.basename(f))[0],
                      "name": data["metadata"]["name"],
                      "version": data["metadata"].get("version", "unknown"),
                      "description": data["metadata"]["description"]
                  })
          with open("dist/index.json", "w", encoding="utf-8") as out:
              json.dump(manifests, out, indent=2, ensure_ascii=False)
          '

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
